<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
    </script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Mi Tienda USTA</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" href="/products">Productos</a>
            <a class="nav-link" href="/clients">Clientes</a>
        </div>
        <button class="btn btn-outline-light btn-sm" onclick="toggleTheme()" type="button">Cambiar Tema</button>
    </div>
</nav>
<div class="container">
    <h2>Listado de Productos</h2>
    <a href="/products/new" class="btn btn-primary mb-3">Nuevo Producto</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        {#for product in products}
            <tr>
                <td>{product.id}</td>
                <td>{product.name}</td>
                <td>${product.price}</td>
                <td>{product.stock}</td>
                <td>
                    <a href="/products/edit/{product.id}" class="btn btn-warning btn-sm">Editar</a>
                    <form action="/products/delete/{product.id}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </form>
                </td>
            </tr>
        {/for}
        </tbody>
    </table>
</div>
</body>
</html>
