<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Mi Tienda USTA</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/products">Productos</a>
            <a class="nav-link active" href="/clients">Clientes</a>
        </div>
    </div>
</nav>
<div class="container">
    <h2>Listado de Clientes</h2>
    <a href="/clients/new" class="btn btn-primary mb-3">Nuevo Cliente</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Productos Comprados</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        {#for client in clients}
            <tr>
                <td>{client.id}</td>
                <td>{client.name}</td>
                <td>{client.email}</td>
                <td><span class="badge bg-info text-dark">{client.purchasedCount}</span></td>
                <td>
                    <a href="/clients/edit/{client.id}" class="btn btn-warning btn-sm">Editar / Asignar Producto</a>
                    <form action="/clients/delete/{client.id}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </form>
                </td>
            </tr>
        {/for}
        </tbody>
    </table>
</div>
</body>
</html>
